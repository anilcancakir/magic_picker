name: Bug Report
description: Report a bug in magic_picker
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A bug is easier to fix when it names the platform and
        the call that was wrong: `Pick.image`, `Pick.file`, `Pick.saveFile` or the
        share-sheet download handler.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        For example:
        1. Boot the app with the picker provider
        2. Call `Pick.image()`
        3. Choose a file in the system dialog
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: magic_picker Version
      placeholder: "0.0.1"
    validations:
      required: true

  - type: textarea
    id: flutter-doctor
    attributes:
      label: flutter doctor -v
      render: shell
