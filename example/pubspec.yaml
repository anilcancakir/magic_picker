name: magic_picker_example
description: Picks an image with Pick.image behind a button and shows the name, size and type of the MagicFile it returns.
publish_to: 'none'

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^1.0.0
  magic_picker:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
